name: Build HealthyIG (renamed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HealthyIG (this repo)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          apktool --version

      - name: Download source APK from release (tag source-apk)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build
          gh release download source-apk --repo ${{ github.repository }} --pattern 'Ig.apk' --dir build
          test -f build/Ig.apk || { echo "::error::Ig.apk did not download"; exit 1; }
          ls -la build

      - name: Decompile
        run: |
          cd build
          apktool d -r -f -o ig_plain Ig.apk
          test -d ig_plain/smali || { echo "::error::Decompile produced no smali folder"; exit 1; }

      - name: Run HealthyIG's endpoint-breaking script
        run: |
          cp script.sh build/
          cd build
          chmod +x script.sh
          ./script.sh

      - name: Recompile
        run: |
          cd build
          apktool b -f ig_plain -o patched.apk
          test -f patched.apk || { echo "::error::Recompile produced no patched.apk"; exit 1; }
          ls -la patched.apk

      - name: Download ApkRenamer and apktool.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tool bin

          gh release download --repo dvaoru/ApkRenamer --pattern '*.zip' --dir tool
          cd tool
          zipfile=$(ls *.zip | head -n1)
          unzip -o "$zipfile"
          cd ..
          find tool -iname "renamer.jar" -exec cp {} tool/renamer.jar \;
          test -f tool/renamer.jar || { echo "::error::renamer.jar not found after extracting ApkRenamer"; ls -R tool; exit 1; }

          gh release download --repo iBotPeaches/Apktool --pattern '*.jar' --dir bin
          apktool_jar=$(ls bin/apktool_*.jar | head -n1)
          mv "$apktool_jar" bin/apktool.jar
          test -f bin/apktool.jar || { echo "::error::apktool.jar not found"; ls -R bin; exit 1; }

          ls -R tool bin

      - name: Rename package to com.yuhan.ig and sign
        run: |
          java -jar tool/renamer.jar \
            -a build/patched.apk \
            -o healthyig.apk \
            -n "HealthyIG" \
            -p com.yuhan.ig \
            -d
          test -f healthyig.apk || { echo "::error::healthyig.apk was not produced"; exit 1; }
          ls -la healthyig.apk

      - name: Upload built APK as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: healthyig-apk
          path: healthyig.apk
